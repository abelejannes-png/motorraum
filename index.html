<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Motorraum">
<meta name="theme-color" content="#060a10">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Motorraum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: mobile app shell — sticky header, scrolling view, fixed tab bar; detail sheets slide over. Single dark "hologram bay" look by design. */
:root{
  --bg:#060a10; --panel:#0c141e; --panel2:#111c29; --line:#1c2b3c;
  --fg:#e4eef6; --muted:#8397aa; --holo:#5fe3ff; --holo-dim:rgba(95,227,255,.14);
  --amber:#ffb648; --ok:#57e39a; --bad:#ff6b6b;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--holo);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 70%,transparent);display:flex;align-items:center;justify-content:space-between;padding-block:14px 10px}
.brand{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.brand b{color:var(--holo)}
.stats{display:flex;gap:8px;font-family:var(--f-mono);font-size:13px}
.stat{display:flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:99px;background:var(--panel)}
.stat i{font-style:normal;color:var(--amber)}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(8,13,20,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-weight:500}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7}
.tab[aria-selected="true"]{color:var(--holo)}

/* stage (hologram) */
.stage{position:relative;height:min(46vh,380px);border-radius:18px;overflow:hidden;background:radial-gradient(ellipse 70% 55% at 50% 85%,rgba(95,227,255,.13),transparent 70%),linear-gradient(#08111b,#050910);border:1px solid var(--line);touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,rgba(95,227,255,.035) 2px 3px)}
.stage.small{height:200px}
.hud{position:absolute;left:12px;top:10px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:2}
.hud .h1{font-family:var(--f-display);font-size:22px;font-weight:700;color:var(--holo);text-shadow:0 0 12px rgba(95,227,255,.5);line-height:1.1}
.hud .h2{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:2px}
.pick{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);z-index:2;font-family:var(--f-mono);font-size:12px;padding:6px 12px;border-radius:99px;background:rgba(6,10,16,.85);border:1px solid var(--holo);color:var(--holo);white-space:nowrap;transition:opacity .25s}
.pick.hide{opacity:0}
.ctrl{position:absolute;right:10px;bottom:10px;z-index:3;display:flex;gap:6px}
.ctrl button{width:36px;height:36px;border-radius:10px;background:rgba(6,10,16,.8);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px}
.ctrl button[aria-pressed="true"]{border-color:var(--holo);color:var(--holo)}
.sbtns{position:absolute;left:10px;bottom:10px;z-index:3;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 110px)}
.sbtns button{min-width:36px;height:36px;padding:0 10px;border-radius:10px;background:rgba(6,10,16,.8);border:1px solid var(--line);font-family:var(--f-mono);font-size:13px;touch-action:none;user-select:none;-webkit-user-select:none}
.sbtns button[aria-pressed="true"]{border-color:var(--holo);color:var(--holo);background:rgba(95,227,255,.12)}
.sbtns button.big{padding:0 18px;font-weight:500}
.hint{position:absolute;left:12px;bottom:14px;z-index:2;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);pointer-events:none}

/* learn path */
.hero{margin-top:4px}
.hero .stage{height:190px}
.hero-txt{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:14px 2px 2px}
.hero-txt h1{font-size:30px}
.unit{margin-top:26px}
.unit-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.unit-head h2{font-size:20px}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 0 6px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;width:150px}
.node .dot{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--panel2);font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--muted);position:relative}
.node .nm{font-size:13px;text-align:center;line-height:1.25;color:var(--muted)}
.node.done .dot{border-color:var(--ok);color:var(--ok);background:rgba(87,227,154,.08)}
.node.done .nm{color:var(--fg)}
.node.current .dot{border-color:var(--holo);color:var(--bg);background:var(--holo);box-shadow:0 0 0 6px var(--holo-dim),0 0 26px rgba(95,227,255,.45)}
.node.current .nm{color:var(--fg);font-weight:600}
.node.locked{opacity:.55}
.node.soon .dot{border-style:dashed}
@media (prefers-reduced-motion:no-preference){.node.current .dot{animation:pulse 2.2s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 11px rgba(95,227,255,.06),0 0 30px rgba(95,227,255,.6)}}

/* cards / lists */
.sec{margin-top:24px}
.sec h2{font-size:22px;margin-bottom:4px}
.sec>p{margin:0 0 12px;color:var(--muted);max-width:60ch}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);min-width:0}
.card h3{font-size:20px}
.card p{margin:0;font-size:13px;color:var(--muted);line-height:1.4}
.card:active{border-color:var(--holo)}
.glyph{width:42px;height:42px;stroke:var(--holo);fill:none;stroke-width:1.6}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.holo{border-color:rgba(95,227,255,.5);color:var(--holo)}
.chip.amber{border-color:rgba(255,182,72,.5);color:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;margin-bottom:10px}
.search:focus{outline:none;border-color:var(--holo)}
.car-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);width:100%;text-align:left}
.car-row+.car-row{margin-top:8px}
.car-row .info{flex:1;min-width:0}
.car-row h3{font-size:19px}
.car-row .sub{font-size:12.5px;color:var(--muted)}
.pin{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);flex:none}
.pin svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.pin[aria-pressed="true"]{color:var(--amber);border-color:rgba(255,182,72,.6);background:rgba(255,182,72,.08)}
.pin[aria-pressed="true"] svg{fill:currentColor}
.garage{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{position:relative;padding:14px;border-radius:16px;text-align:left;background:linear-gradient(160deg,rgba(95,227,255,.10),rgba(95,227,255,.02) 60%),var(--panel);border:1px solid rgba(95,227,255,.35);display:flex;flex-direction:column;gap:4px;min-width:0}
.gcard h3{font-size:21px}
.gcard .sub{font-size:12.5px;color:var(--muted)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:14px}

/* sheet (lesson + details) */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-in{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 10px) calc(110px + env(safe-area-inset-bottom,0px))}
.sheet-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.x{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none}
.bar{flex:1;height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--holo);border-radius:99px;box-shadow:0 0 12px rgba(95,227,255,.6);transition:width .35s}
.step h2{font-size:26px;margin:16px 0 8px}
.step p{margin:0 0 10px;max-width:62ch;font-size:16px}
.step strong{color:var(--holo);font-weight:600}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 4px;font-family:var(--f-mono);font-size:12px}
.chain span{padding:4px 8px;border:1px solid rgba(95,227,255,.45);border-radius:8px;color:var(--holo)}
.chain em{font-style:normal;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--panel);font-size:16px}
.opt[aria-pressed="true"]{border-color:var(--holo);background:rgba(95,227,255,.07)}
.opt.right{border-color:var(--ok);background:rgba(87,227,154,.1)}
.opt.wrong{border-color:var(--bad);background:rgba(255,107,107,.1)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:45;border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot.good{background:#0b1f17;border-color:rgba(87,227,154,.4)}
.foot.bad{background:#241012;border-color:rgba(255,107,107,.4)}
.foot-in{max-width:560px;margin:0 auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.fb{font-size:14.5px}
.fb b{display:block;font-family:var(--f-display);font-size:20px}
.foot.good .fb b{color:var(--ok)}.foot.bad .fb b{color:var(--bad)}
.btn{width:100%;padding:15px;border-radius:14px;background:var(--holo);color:#04121a;font-weight:600;font-size:16px;letter-spacing:.02em}
.btn:disabled{background:var(--panel2);color:var(--muted)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.done-wrap{text-align:center;padding-top:40px}
.done-wrap .big{font-family:var(--f-display);font-size:64px;font-weight:700;color:var(--holo);text-shadow:0 0 24px rgba(95,227,255,.5);line-height:1}
.detail h1{font-size:34px}
.detail .lede{color:var(--muted);margin:4px 0 14px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:6px}
.spec dt,.spec dd{margin:0;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
.spec dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--panel);padding-top:13px}
.spec dd{min-width:0}
.spec dt:nth-last-of-type(1),.spec dd:last-child{border-bottom:0}
.spec a,.link{color:var(--holo);text-decoration:none;border-bottom:1px solid rgba(95,227,255,.35);cursor:pointer}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.seg button{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:13.5px}
.seg button[aria-pressed="true"]{border-color:var(--holo);color:var(--holo);background:rgba(95,227,255,.07)}
ul.plain{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.plain li{padding:11px 13px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:14px}
ul.plain li b{display:block;font-weight:600;margin-bottom:1px}
ul.warn li{border-left:3px solid var(--amber)}
details{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-top:8px}
summary{padding:12px 14px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";font-family:var(--f-mono);color:var(--holo)}
details[open] summary::after{content:"–"}
details ol{margin:0;padding:0 16px 14px 34px;font-size:14px;display:flex;flex-direction:column;gap:6px}
details .note{padding:0 14px 14px;font-size:13px;color:var(--muted)}
.pros{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.pros div{padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:13.5px;min-width:0}
.pros ul{margin:6px 0 0;padding-left:18px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--panel2);border:1px solid var(--holo);color:var(--fg);padding:9px 16px;border-radius:99px;font-size:13.5px;white-space:nowrap}

/* glossary */
.term{display:inline;padding:0;font:inherit;color:inherit;border-bottom:1.5px dotted var(--holo);cursor:help;text-align:inherit;line-height:inherit}
.term:hover{background:var(--holo-dim)}
.gback{position:fixed;inset:0;z-index:80;background:rgba(2,5,9,.62);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.gpop{width:100%;max-width:520px;background:var(--panel2);border:1px solid rgba(95,227,255,.5);border-radius:18px;padding:16px 16px 14px;box-shadow:0 0 40px rgba(95,227,255,.15)}
.gpop h3{font-size:24px;color:var(--holo);margin:2px 0 6px}
.gpop p{margin:0 0 12px;font-size:15.5px;max-width:60ch}
.gpop .row{display:flex;gap:8px;flex-wrap:wrap}
.gpop .row .btn{width:auto;flex:1;padding:12px;font-size:14.5px}
.pick{cursor:pointer}
.lex{display:flex;flex-wrap:wrap;gap:6px}
.lex .term{border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13px;background:var(--panel)}
@media (max-width:380px){.grid,.garage,.pros{grid-template-columns:1fr}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>


<div class="app" id="app">
  <header class="top">
    <div class="brand">Motor<b>raum</b></div>
    <div class="stats"><span class="stat" title="Tage in Folge"><i>▲</i><span id="st-streak">0</span></span><span class="stat" title="Erfahrungspunkte"><span id="st-xp">0</span> XP</span></div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Bereiche"><div class="tabs-in">
  <button class="tab" data-tab="learn" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 19V8l8-4 8 4v11"/><path d="M8 19v-6h8v6"/></svg>Lernen</button>
  <button class="tab" data-tab="motors" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="5" y="8" width="11" height="9" rx="1"/><path d="M16 11h3v3h-3M8 8V5h5v3M5 12H3"/></svg>Motoren</button>
  <button class="tab" data-tab="garage" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 11l9-6 9 6v9H3z"/><path d="M7 20v-5h10v5"/></svg>Garage</button>
</div></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* ============ STATE ============ */
const KEY="motorraum.v1";
const defaults={done:[],xp:0,streak:0,lastDay:null,pinned:["vw-t3","audi-80"],variant:{}};
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s)return Object.assign({},defaults,s)}catch(e){}return JSON.parse(JSON.stringify(defaults))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}updateStats()}
function updateStats(){document.getElementById("st-xp").textContent=S.xp;document.getElementById("st-streak").textContent=S.streak}
function dayStr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============ CONTENT: LESSONS ============ */
const UNITS=[
 {id:"u1",name:"Das große Ganze",sub:"Einheit 1",lessons:["l1","l2","l3"]},
 {id:"u2",name:"Motoren verstehen",sub:"Einheit 2",lessons:["l4","l5"]},
 {id:"u3",name:"Kraft auf die Straße",sub:"Einheit 3",lessons:["l6","l7","l8"]},
 {id:"u4",name:"Am Leben halten",sub:"Einheit 4",lessons:["l9","l10","l11"]},
 {id:"u5",name:"Fahren & Anhalten",sub:"Einheit 5",lessons:["l12","l13"]}
];
const SOON={};
const DT={scene:"drivetrain"};
const LESSONS={
 l1:{title:"Was ist ein Auto?",steps:[
  {...DT,h:"Energie rein, Bewegung raus",t:"<p>Ein Auto macht aus Energie Bewegung. Im Tank steckt die Energie, am Ende drehen sich die Räder.</p><p>Dazwischen sitzt eine Kette von Bauteilen. Sie heißt <strong>Antriebsstrang</strong>.</p>"},
  {...DT,h:"Die Kette",t:"<div class='chain'><span>Motor</span><em>→</em><span>Kupplung</span><em>→</em><span>Getriebe</span><em>→</em><span>Welle</span><em>→</em><span>Differential</span><em>→</em><span>Räder</span></div><p>Der Lichtpunkt im Hologramm zeigt, wie die Kraft wandert. Tippe ein Teil an, dann siehst du seinen Namen.</p>"},
  {...DT,h:"Wer macht was?",t:"<p>Der <strong>Motor</strong> erzeugt Drehung. Die <strong>Kupplung</strong> kann ihn vom Rest trennen, zum Beispiel beim Anfahren und beim Schalten.</p><p>Das <strong>Getriebe</strong> legt fest, wie schnell sich die Räder im Verhältnis zum Motor drehen. Das sind die Gänge.</p>"},
  {q:"Was sitzt direkt hinter dem Motor?",o:["Das Getriebe","Die Kupplung","Das Differential"],a:1,e:"Die Kupplung sitzt zwischen Motor und Getriebe. Nur so kann sie den Motor vom Getriebe trennen."},
  {...DT,h:"Das Differential",t:"<p>In einer Kurve fährt das äußere Rad einen längeren Weg als das innere. Also muss es sich schneller drehen.</p><p>Das <strong>Differential</strong> verteilt die Kraft auf beide Räder und lässt sie trotzdem unterschiedlich schnell drehen.</p>"},
  {q:"Warum hat ein Auto ein Getriebe?",o:["Damit der Motor Strom erzeugt","Damit Motor- und Raddrehzahl zur Geschwindigkeit passen","Damit das Auto bremsen kann"],a:1,e:"Ein Motor arbeitet nur in einem bestimmten Drehzahlbereich gut. Mit den Gängen passt das Getriebe die Raddrehzahl daran an."},
  {q:"Wozu braucht man das Differential?",o:["Damit sich die Räder in der Kurve unterschiedlich schnell drehen können","Damit der Motor kühl bleibt","Damit man rückwärts fahren kann"],a:0,e:"Ohne Differential würde ein Rad in jeder Kurve radieren oder springen."}
 ]},
 l2:{title:"Der Motor im Prinzip",steps:[
  {scene:"piston",h:"Druck schiebt den Kolben",t:"<p>Fast jeder Verbrennungsmotor funktioniert gleich. In einem <strong>Zylinder</strong> verbrennt ein Gemisch aus Luft und Kraftstoff.</p><p>Der Druck schiebt den <strong>Kolben</strong> nach unten.</p>"},
  {scene:"piston",h:"Wie beim Fahrradpedal",t:"<p>Der Kolben hängt an der <strong>Pleuelstange</strong>. Die sitzt außermittig an der <strong>Kurbelwelle</strong>, so wie dein Bein am Pedal.</p><p>So wird aus Auf-und-Ab eine Drehung. Tippe die Teile im Hologramm an.</p>"},
  {q:"Welches Teil macht aus dem Auf und Ab eine Drehung?",o:["Der Kolben","Die Kurbelwelle","Der Zylinder"],a:1,e:"Die Kurbelwelle hat versetzte Zapfen. Daran zieht und drückt die Pleuelstange und dreht sie so."},
  {scene:"piston",h:"OT, UT und Hubraum",t:"<p>Der höchste Punkt des Kolbens heißt <strong>oberer Totpunkt (OT)</strong>, der tiefste <strong>unterer Totpunkt (UT)</strong>.</p><p>Der Raum dazwischen, mal Anzahl der Zylinder, ist der <strong>Hubraum</strong>. Er steht in deinem Fahrzeugschein unter <strong>P.1</strong>, in cm³.</p>"},
  {q:"Im Fahrzeugschein steht unter P.1: 1781 cm³. Was ist das?",o:["Das Leergewicht","Der Hubraum","Die Leistung"],a:1,e:"P.1 ist der Hubraum. 1781 cm³ sind etwa 1,8 Liter. Die Leistung steht unter P.2, in kW."},
  {q:"Wie heißt die Stange zwischen Kolben und Kurbelwelle?",o:["Nockenwelle","Pleuelstange","Antriebswelle"],a:1,e:"Die Pleuelstange, kurz Pleuel, verbindet den Kolben mit der Kurbelwelle."}
 ]},
 l3:{title:"Der Viertakt",steps:[
  {scene:"fourstroke",h:"Vier Schritte, zwei Umdrehungen",t:"<p>Ein Benzinmotor arbeitet in vier Schritten, den <strong>Takten</strong>. Dabei dreht sich die Kurbelwelle zweimal, also um 720 Grad.</p><p>Oben im Hologramm siehst du, welcher Takt gerade läuft. Mit <b>½</b> wird es langsamer.</p>"},
  {scene:"fourstroke",h:"1 · Ansaugen",t:"<p>Der Kolben geht nach unten. Das <strong>Einlassventil</strong> ist offen, frisches Gemisch aus Luft und Benzin strömt in den Zylinder.</p>"},
  {scene:"fourstroke",h:"2 · Verdichten",t:"<p>Beide Ventile sind zu. Der Kolben geht nach oben und drückt das Gemisch auf einen Bruchteil zusammen. Dadurch wird es heiß und verbrennt später besser.</p>"},
  {scene:"fourstroke",h:"3 · Arbeiten",t:"<p>Kurz vor dem OT zündet die <strong>Zündkerze</strong>. Das Gemisch verbrennt explosionsartig, der Druck schiebt den Kolben nach unten.</p><p>Nur in diesem Takt entsteht Kraft. Die anderen drei laufen mit Schwung mit.</p>"},
  {scene:"fourstroke",h:"4 · Ausstoßen",t:"<p>Das <strong>Auslassventil</strong> öffnet. Der Kolben geht hoch und schiebt das Abgas in den Auspuff. Danach beginnt alles von vorn.</p>"},
  {q:"In welchem Takt entsteht die Kraft?",o:["Ansaugen","Verdichten","Arbeiten","Ausstoßen"],a:2,e:"Im Arbeitstakt drückt das verbrennende Gemisch den Kolben nach unten. Das ist der einzige Takt, der Kraft liefert."},
  {q:"Was passiert beim Verdichten?",o:["Das Gemisch wird zusammengedrückt","Abgas strömt hinaus","Beide Ventile öffnen"],a:0,e:"Beide Ventile sind zu, der Kolben drückt das Gemisch zusammen."},
  {q:"Wie oft dreht sich die Kurbelwelle für alle vier Takte?",o:["Einmal","Zweimal","Viermal"],a:1,e:"Jeder Takt ist eine halbe Umdrehung. Vier Takte sind zwei Umdrehungen, also 720°."}
 ]},
 l4:{title:"Benzin oder Diesel?",steps:[
  {scene:"fourstroke",opts:{fuel:"benzin"},h:"Benziner: der Funke",t:"<p>Beim Benziner zündet die <strong>Zündkerze</strong> das verdichtete Gemisch mit einem Funken. Das nennt man <strong>Fremdzündung</strong>.</p>"},
  {scene:"fourstroke",opts:{fuel:"diesel"},h:"Diesel: Hitze durch Druck",t:"<p>Ein Diesel hat keine Zündkerze. Er saugt nur Luft an und drückt sie so stark zusammen, dass sie mehrere hundert Grad heiß wird.</p><p>Dann spritzt die <strong>Einspritzdüse</strong> Diesel hinein, und der entzündet sich von selbst. Das ist die <strong>Selbstzündung</strong>.</p>"},
  {scene:"fourstroke",opts:{fuel:"diesel"},h:"Was daraus folgt",t:"<p>Ein Diesel verdichtet viel stärker: etwa 16:1 bis 23:1. Ältere Benziner liegen etwa bei 8:1 bis 11:1.</p><p>Darum ist der Diesel sparsam und hat viel Kraft bei niedriger Drehzahl. Er ist aber schwerer und dreht nicht so hoch.</p><p>Bei kaltem Motor helfen <strong>Glühkerzen</strong> beim Start. Deshalb wartest du beim alten Diesel aufs Vorglühen.</p>"},
  {q:"Was zündet den Kraftstoff im Diesel?",o:["Die Zündkerze","Die Hitze der stark verdichteten Luft","Die Batterie direkt"],a:1,e:"Selbstzündung: Die Luft ist durch die Verdichtung so heiß, dass der eingespritzte Diesel von allein brennt."},
  {q:"Wofür ist die Glühkerze da?",o:["Für den Kaltstart","Für das Licht","Für die Kühlung"],a:0,e:"Sie heizt den Brennraum vor, solange der Motor kalt ist. Danach reicht die Verdichtungshitze."},
  {q:"Welcher Motor verdichtet stärker?",o:["Der Benziner","Der Diesel","Beide gleich"],a:1,e:"Der Diesel braucht die hohe Verdichtung, sonst wird die Luft nicht heiß genug."}
 ]},
 l6:{title:"Die Kupplung",steps:[
  {scene:"clutch",h:"Warum man trennen muss",t:"<p>Ein Verbrennungsmotor muss immer drehen, im Leerlauf etwa 800 bis 900 U/min. Beim Anfahren stehen die Räder aber still.</p><p>Wäre der Motor fest mit den Rädern verbunden, würde er sofort absterben. Die <strong>Kupplung</strong> löst das: Sie kann Motor und Getriebe trennen und weich wieder verbinden.</p>"},
  {scene:"clutch",h:"Der Aufbau",t:"<p>An der Kurbelwelle sitzt das schwere <strong>Schwungrad</strong>. Davor liegt die <strong>Kupplungsscheibe</strong> mit dem <strong>Reibbelag</strong>, sie steckt auf der Getriebeeingangswelle.</p><p>Die <strong>Druckplatte</strong> presst die Scheibe mit einer starken <strong>Membranfeder</strong> gegen das Schwungrad. Dann dreht sich alles gemeinsam.</p>"},
  {scene:"clutch",h:"Pedal treten",t:"<p>Trittst du das Pedal, drückt das <strong>Ausrücklager</strong> auf die Federzungen. Die Druckplatte hebt ab, die Scheibe ist frei.</p><p>Der Motor dreht weiter, das Getriebe bleibt stehen. <b>Halte im Hologramm den Knopf „Pedal“ gedrückt</b> und schau auf die Drehzahlen oben.</p>"},
  {scene:"clutch",h:"Der Schleifpunkt",t:"<p>Lässt du das Pedal langsam kommen, berührt der Belag zuerst nur leicht. Er rutscht und nimmt die Scheibe allmählich mit. Das ist der <strong>Schleifpunkt</strong>, so fährst du sanft an.</p><p>Beim Rutschen nutzt sich der Reibbelag ab. Darum das Pedal nicht lange schleifen lassen.</p>"},
  {q:"Was passiert, wenn du das Kupplungspedal ganz trittst?",o:["Der Motor geht aus","Motor und Getriebe sind getrennt","Das Auto bremst"],a:1,e:"Die Druckplatte hebt ab, die Scheibe ist frei. Der Motor dreht weiter, das Getriebe nicht."},
  {q:"Welches Teil presst die Kupplungsscheibe ans Schwungrad?",o:["Die Druckplatte","Das Ausrücklager","Der Kolben"],a:0,e:"Die Druckplatte mit ihrer Membranfeder presst die Scheibe fest. Das Ausrücklager löst sie nur."},
  {q:"Was verschleißt bei der Kupplung mit der Zeit?",o:["Das Schwungrad","Der Reibbelag","Die Kurbelwelle"],a:1,e:"Der Reibbelag wird bei jedem Anfahren etwas dünner. Ist er runter, rutscht die Kupplung durch."},
  {scene:"clutch",h:"Bei deinem T3",t:"<p>Weil der Motor gerade draußen ist, siehst du hinten am Getriebe die <strong>Kupplungsglocke</strong> mit dem Ausrücklager.</p><p>Schwungrad, Druckplatte und Scheibe sitzen am Motor und sind mit ihm ausgebaut. Wenn ein neuer Motor reinkommt, ist das ein guter Moment, die Kupplung gleich mitzuerneuern.</p>"}
 ]},
 l7:{title:"Getriebe & Gänge",steps:[
  {scene:"gearbox",h:"Warum Gänge?",t:"<p>Ein Motor arbeitet gut in einem schmalen Bereich, etwa zwischen 1500 und 5500 U/min. Die Räder müssen aber von 0 bis Autobahntempo drehen.</p><p>Das <strong>Getriebe</strong> verbindet beides, mit verschiedenen <strong>Übersetzungen</strong>, den Gängen.</p>"},
  {scene:"gearbox",h:"Wie beim Fahrrad",t:"<p>Treibt ein kleines Zahnrad ein großes an, dreht das große langsamer, aber mit mehr Kraft. Diese Drehkraft heißt <strong>Drehmoment</strong>.</p><p>Im 1. Gang treibt ein kleines Rad ein großes: viel Kraft zum Anfahren. Im 4. Gang ist es umgekehrt: wenig Kraft, viel Tempo.</p><p>Tippe im Hologramm auf <b>N, 1, 2, 3, 4</b> und vergleiche.</p>"},
  {scene:"gearbox",h:"Was die Zahl bedeutet",t:"<p>Eine Übersetzung von <strong>2,33 : 1</strong> heißt: Der Motor dreht sich 2,33-mal, bis sich die Abtriebswelle einmal dreht.</p><p>Bei <strong>1 : 1</strong> drehen beide gleich schnell. Liegt die Zahl unter 1, dreht der Ausgang sogar schneller als der Motor. Das ist ein Spargang.</p>"},
  {scene:"gearbox",h:"Was beim Schalten passiert",t:"<p>Im Schaltgetriebe sind alle Zahnradpaare immer im Eingriff. Die unteren Räder, die <strong>Losräder</strong>, drehen aber lose auf ihrer Welle.</p><p>Beim Schalten schiebt die <strong>Schaltmuffe</strong> ein Losrad fest an die Welle. Vorher gleichen <strong>Synchronringe</strong> die Drehzahlen an. Deshalb kracht es nicht, wenn du richtig kuppelst.</p><p>Das Hologramm ist vereinfacht. Echte Getriebe haben noch eine dritte Welle und mehr Gänge.</p>"},
  {scene:"gearbox",h:"Rückwärts",t:"<p>Für den <strong>Rückwärtsgang</strong> sitzt ein drittes Zahnrad dazwischen, das <strong>Zwischenrad</strong>. Es dreht die Richtung um.</p>"},
  {q:"In welchem Gang kommt die meiste Kraft am Rad an?",o:["Im 1. Gang","Im 4. Gang","Im Leerlauf"],a:0,e:"Der 1. Gang hat die größte Übersetzung. Die Räder drehen langsam, dafür mit viel Drehmoment."},
  {q:"Was heißt Übersetzung 2 : 1?",o:["Der Motor dreht zweimal, die Welle einmal","Die Welle dreht doppelt so schnell","Zwei Gänge sind eingelegt"],a:0,e:"Erst die Motorumdrehungen, dann die Umdrehungen am Ausgang."},
  {q:"Warum kracht es beim Schalten normalerweise nicht?",o:["Weil die Synchronringe die Drehzahl angleichen","Weil der Motor ausgeht","Weil das Getriebe leer ist"],a:0,e:"Die Synchronringe bremsen oder beschleunigen das Losrad, bis es zur Welle passt. Erst dann rastet die Schaltmuffe ein."},
  {q:"Wodurch fährt das Auto rückwärts?",o:["Der Motor dreht andersrum","Ein Zwischenrad kehrt die Drehrichtung um","Die Kupplung dreht sich um"],a:1,e:"Der Motor dreht immer in dieselbe Richtung. Das Zwischenrad im Rückwärtsgang kehrt sie um."}
 ]},
 l8:{title:"Das Differential",steps:[
  {scene:"diff",h:"Zwei Räder, zwei Wege",t:"<p>In einer Kurve fährt das äußere Rad einen größeren Bogen als das innere. Es muss sich schneller drehen.</p><p>Beide hängen aber am selben Antrieb. Das <strong>Differential</strong> macht beides möglich.</p>"},
  {scene:"diff",h:"Der Aufbau",t:"<p>Die Kardanwelle oder das Getriebe treibt ein kleines <strong>Kegelrad</strong>. Das dreht das große <strong>Tellerrad</strong>, und damit das <strong>Ausgleichsgehäuse</strong>.</p><p>Im Gehäuse sitzen zwei kleine <strong>Ausgleichskegelräder</strong>. Sie greifen in die beiden <strong>Achswellenräder</strong>, und die führen zu den Rädern.</p>"},
  {scene:"diff",h:"Geradeaus und Kurve",t:"<p>Geradeaus stehen die Ausgleichskegelräder still. Das Gehäuse dreht sich wie ein Block, beide Räder gleich schnell.</p><p>In der Kurve fangen sie an zu drehen. Was das eine Rad langsamer wird, wird das andere schneller. Tippe im Hologramm auf <b>↑, ↰ und ↱</b>.</p>"},
  {scene:"diff",h:"Der Haken",t:"<p>Das Differential schickt die Kraft dahin, wo es am leichtesten geht. Steht ein Rad auf Eis, dreht es durch, und das andere bekommt kaum Kraft.</p><p>Dagegen hilft eine <strong>Differenzialsperre</strong>. Sie verbindet beide Seiten fest. Beim T3 Syncro gab es sie auf Wunsch für die Hinterachse.</p><p>Bei deinem T3 und beim Audi 80 steckt das Differential übrigens direkt im Getriebegehäuse.</p>"},
  {q:"Welches Rad dreht in einer Linkskurve schneller?",o:["Das linke","Das rechte","Beide gleich"],a:1,e:"In der Linkskurve ist das rechte Rad außen. Es fährt den größeren Bogen und dreht schneller."},
  {q:"Was tun die Ausgleichskegelräder bei Geradeausfahrt?",o:["Sie drehen sich schnell","Sie stehen still im Gehäuse","Sie bremsen die Räder"],a:1,e:"Sie drehen nur mit dem Gehäuse mit, aber nicht um sich selbst. Erst in der Kurve gleichen sie aus."},
  {q:"Was passiert ohne Sperre, wenn ein Rad auf Eis steht?",o:["Es dreht durch, das andere bekommt kaum Kraft","Beide Räder greifen gleich gut","Der Motor geht aus"],a:0,e:"Die Kraft geht den leichtesten Weg. Eine Differenzialsperre verhindert das."}
 ]},
 l9:{title:"Die Kühlung",steps:[
  {scene:"cooling",h:"Wohin mit der Hitze?",t:"<p>Nur etwa ein Drittel der Energie im Kraftstoff wird zu Bewegung. Der Rest ist Wärme. Ein Teil geht mit dem Abgas raus, den Rest muss die <strong>Kühlung</strong> abführen.</p><p>Ohne Kühlung würde der Motor in wenigen Minuten überhitzen und Schaden nehmen.</p>"},
  {scene:"cooling",h:"Der Kreislauf",t:"<p>Die <strong>Wasserpumpe</strong> drückt <strong>Kühlmittel</strong> durch Kanäle im Motorblock und im Zylinderkopf. Dort nimmt es die Wärme auf.</p><p>Dann fließt es zum <strong>Kühler</strong> vorne am Auto. Der Fahrtwind kühlt es ab, und es geht zurück zum Motor. Im Stand hilft ein <strong>Lüfter</strong>.</p>"},
  {scene:"cooling",h:"Der Thermostat",t:"<p>Ein kalter Motor verschleißt schneller und braucht mehr Kraftstoff. Darum hält der <strong>Thermostat</strong> den Weg zum Kühler zuerst geschlossen. Das Kühlmittel fließt im kleinen Kreislauf nur durch den Motor.</p><p>Bei etwa 85 bis 90 °C öffnet er. Schau im Hologramm auf die Temperatur. Mit <b>Kaltstart</b> geht es von vorne los.</p>"},
  {scene:"cooling",h:"Unter Druck",t:"<p>Das System steht unter leichtem Überdruck. Dadurch kocht das Kühlmittel erst weit über 100 °C. Der <strong>Ausgleichsbehälter</strong> nimmt auf, was sich beim Erwärmen ausdehnt.</p><p><b>Wichtig:</b> Den Deckel nie bei heißem Motor öffnen. Kochendes Kühlmittel kann herausspritzen.</p>"},
  {scene:"cooling",h:"Luftgekühlt",t:"<p>Der Käfer und der T3 bis 1983 kommen ohne Wasser aus. Ein <strong>Gebläse</strong> bläst Luft über Rippen an den Zylindern. Das Motoröl hilft beim Kühlen mit.</p><p>Beim Wasserboxer im T3 sitzt der Kühler vorne und der Motor hinten. Dazwischen laufen lange Leitungen. Deshalb ist das <strong>Entlüften</strong> dort besonders wichtig.</p>"},
  {q:"Was macht der Thermostat bei kaltem Motor?",o:["Er hält den Weg zum Kühler geschlossen","Er schaltet den Motor ab","Er heizt das Kühlmittel"],a:0,e:"So wird der Motor schneller warm. Erst bei Betriebstemperatur öffnet er den Weg zum Kühler."},
  {q:"Warum darf man den Kühlerdeckel nicht bei heißem Motor öffnen?",o:["Weil das System unter Druck steht und Kühlmittel herausspritzen kann","Weil der Motor dann ausgeht","Weil das Kühlmittel sonst gefriert"],a:0,e:"Der Überdruck hält das Kühlmittel flüssig. Öffnest du, fällt der Druck, und es kann schlagartig kochen."},
  {q:"Wie wird ein luftgekühlter Boxer gekühlt?",o:["Mit einem Gebläse und Kühlrippen","Mit einem Kühler vorne","Gar nicht"],a:0,e:"Das Gebläse bläst Luft über die Rippen der Zylinder. Kein Kühlmittel, keine Wasserpumpe."}
 ]},
 l10:{title:"Schmierung & Öl",steps:[
  {scene:"oil",h:"Warum Öl?",t:"<p>Im Motor reiben Metallteile mit hoher Geschwindigkeit aneinander. Ohne Öl würden sie sich in Sekunden festfressen.</p><p>Das Öl bildet einen hauchdünnen Film, auf dem die Teile gleiten. Es kühlt außerdem, hält den Motor sauber und dichtet die Kolben ab.</p>"},
  {scene:"oil",h:"Der Ölkreislauf",t:"<p>Das Öl sammelt sich unten in der <strong>Ölwanne</strong>. Die <strong>Ölpumpe</strong> saugt es über ein Sieb an und drückt es durch den <strong>Ölfilter</strong>.</p><p>Von dort fließt es durch Kanäle zu den Lagern der Kurbelwelle und zur Nockenwelle. Danach tropft es zurück in die Wanne.</p>"},
  {scene:"oil",h:"Der Öldruck",t:"<p>Die Pumpe baut <strong>Öldruck</strong> auf. Fällt er zu tief, leuchtet die rote Ölkanne im Tacho.</p><p><b>Dann sofort anhalten und den Motor ausmachen.</b> Ohne Öldruck kann der Motor in kurzer Zeit kaputtgehen. Probier im Hologramm <b>Wenig Öl</b> aus.</p>"},
  {scene:"oil",h:"Was auf der Flasche steht",t:"<p>Eine Angabe wie <strong>10W-40</strong> beschreibt die Viskosität, also wie zäh das Öl ist. Die Zahl vor dem W (Winter) sagt, wie gut es kalt fließt. Die zweite Zahl gilt für den warmen Motor.</p><p>Welches Öl dein Motor braucht, steht im Handbuch. Öl altert mit der Zeit. Gewechselt wird nach Wartungsplan, bei alten Autos oft einmal im Jahr.</p>"},
  {q:"Was tun, wenn die rote Öldruckleuchte während der Fahrt angeht?",o:["Weiterfahren bis zur nächsten Werkstatt","Sofort anhalten und den Motor aus","Mehr Gas geben"],a:1,e:"Ohne Öldruck fehlt der Schmierfilm. Weiterfahren kann den Motor in Minuten zerstören."},
  {q:"Wo sammelt sich das Öl im Motor?",o:["In der Ölwanne","Im Kühler","Im Zylinderkopf"],a:0,e:"Die Ölwanne sitzt unten am Motor. Von dort saugt die Ölpumpe es wieder an."},
  {q:"Was bedeutet das W in 10W-40?",o:["Wasser","Winter","Watt"],a:1,e:"Die Zahl vor dem W beschreibt, wie gut das Öl bei Kälte fließt."}
 ]},
 l11:{title:"Zündung & Elektrik",steps:[
  {scene:"electric12",h:"Strom im Auto",t:"<p>Das Bordnetz arbeitet mit 12 Volt. Die <strong>Batterie</strong> speichert den Strom, den du zum Starten brauchst und wenn der Motor aus ist.</p>"},
  {scene:"electric12",h:"Starten",t:"<p>Drehst du den Schlüssel, bekommt der <strong>Anlasser</strong> viel Strom aus der Batterie. Er ist ein kleiner, kräftiger Elektromotor. Mit einem Zahnrad greift er in den Zahnkranz am Schwungrad und dreht den Motor, bis er von selbst läuft.</p><p>Halte im Hologramm <b>Starten</b> gedrückt.</p>"},
  {scene:"electric12",h:"Die Lichtmaschine",t:"<p>Läuft der Motor, treibt er über einen <strong>Keilriemen</strong> die <strong>Lichtmaschine</strong> an. Sie erzeugt Strom für alles im Auto und lädt die Batterie wieder auf, mit etwa 14 Volt.</p><p>Leuchtet während der Fahrt die Batterieleuchte, lädt die Lichtmaschine nicht. Oft ist dann der Keilriemen gerissen oder locker.</p>"},
  {scene:"electric12",h:"Die Zündung beim Benziner",t:"<p>Für den Funken reichen 12 Volt nicht. Die <strong>Zündspule</strong> macht daraus viele tausend Volt.</p><p>Bei älteren Autos verteilt der <strong>Zündverteiler</strong> diesen Strom über Zündkabel an die richtige Zündkerze. Er hält dabei die <strong>Zündreihenfolge</strong> ein, beim Reihenvierzylinder meist 1-3-4-2, beim VW-Boxer 1-4-3-2.</p><p>Ein Diesel braucht keine Zündanlage. Er hat stattdessen Glühkerzen für den Kaltstart.</p>"},
  {scene:"electric12",h:"Sicherungen",t:"<p>Jeder Stromkreis ist mit einer <strong>Sicherung</strong> geschützt. Gibt es einen Kurzschluss, brennt sie durch, bevor ein Kabel heiß wird.</p><p>Geht ein einzelnes Teil nicht, etwa das Radio oder ein Licht, ist oft die Sicherung schuld. Der Sicherungskasten und ein Plan dazu stehen im Handbuch.</p>"},
  {q:"Welches Teil lädt die Batterie während der Fahrt?",o:["Der Anlasser","Die Lichtmaschine","Die Zündspule"],a:1,e:"Die Lichtmaschine wird vom Motor angetrieben und erzeugt Strom. Der Anlasser verbraucht nur Strom."},
  {q:"Wozu dient die Zündspule?",o:["Sie macht aus 12 Volt viele tausend Volt für den Funken","Sie speichert Strom","Sie dreht den Motor beim Start"],a:0,e:"Nur mit sehr hoher Spannung springt der Funke an der Zündkerze über."},
  {q:"Die Batterieleuchte geht während der Fahrt an. Was ist eine häufige Ursache?",o:["Leerer Tank","Gerissener oder lockerer Keilriemen","Zu viel Öl"],a:1,e:"Ohne Riemen dreht die Lichtmaschine nicht, und das Auto fährt nur noch mit dem Strom aus der Batterie."}
 ]},
 l12:{title:"Die Bremsen",steps:[
  {scene:"brake",h:"Bewegung wird Wärme",t:"<p>Bremsen heißt: Die Bewegung des Autos wird durch Reibung in Wärme umgewandelt. Nach einer starken Bremsung können Bremsscheiben mehrere hundert Grad heiß werden.</p>"},
  {scene:"brake",h:"Vom Pedal zum Rad",t:"<p>Das Pedal drückt auf den <strong>Hauptbremszylinder</strong>. Der presst <strong>Bremsflüssigkeit</strong> durch dünne Leitungen zu allen vier Rädern. Flüssigkeit lässt sich nicht zusammendrücken, deshalb kommt der Druck sofort an.</p><p>Am Rad drückt ein Kolben im <strong>Bremssattel</strong> die <strong>Bremsbeläge</strong> gegen die <strong>Bremsscheibe</strong>. Halte im Hologramm <b>Bremsen</b> gedrückt.</p>"},
  {scene:"brake",h:"Hilfe beim Treten",t:"<p>Der <strong>Bremskraftverstärker</strong> zwischen Pedal und Hauptbremszylinder nutzt Unterdruck vom Motor. So brauchst du viel weniger Kraft am Pedal.</p><p>Bei ausgeschaltetem Motor ist das Pedal deshalb nach ein paarmal Treten auffällig hart.</p>"},
  {scene:"brake",h:"Scheibe und Trommel",t:"<p>Vorne haben fast alle Autos Scheibenbremsen. Hinten sitzt bei älteren Autos oft eine <strong>Trommelbremse</strong>, so beim T3. Dort drücken Bremsbacken von innen gegen eine Trommel.</p>"},
  {scene:"brake",h:"Wartung",t:"<p>Beläge und Scheiben nutzen sich ab und werden irgendwann getauscht. Schleifende oder quietschende Geräusche sind ein Warnzeichen.</p><p>Bremsflüssigkeit zieht mit der Zeit Wasser an. Dadurch kann sie bei Hitze Dampfblasen bilden, und das Pedal fällt durch. Deshalb wird sie meist alle zwei Jahre gewechselt.</p>"},
  {q:"Was macht der Bremssattel?",o:["Er drückt die Beläge gegen die Scheibe","Er kühlt die Bremse","Er misst das Tempo"],a:0,e:"Im Sattel sitzt ein Kolben. Der Flüssigkeitsdruck schiebt ihn nach außen und presst die Beläge an die Scheibe."},

  {scene:"suspension",h:"Feder und Dämpfer",t:"<p>Das <strong>Fahrwerk</strong> hält die Räder auf der Straße. Fährst du über eine Bodenwelle, fängt die <strong>Feder</strong> den Stoß ab.</p><p>Eine Feder allein würde aber lange nachschwingen. Der <strong>Stoßdämpfer</strong> bremst dieses Wippen.</p>"},

  {h:"Spur und Sturz",t:"<p>Die Räder stehen nicht ganz gerade. Die <strong>Spur</strong> sagt, wie sehr sie von oben gesehen nach innen oder außen zeigen. Der <strong>Sturz</strong> sagt, wie schräg sie von vorne gesehen stehen.</p><p>Stimmt das nicht, zieht das Auto zur Seite, und die Reifen nutzen sich einseitig ab. Eingestellt wird das bei einer <strong>Achsvermessung</strong>.</p>"},

/* ============ 3D: HOLOGRAM ENGINE ============ */
const HOLO=0x5fe3ff, AMBER=0xffb648, OKC=0x57e39a;
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
const Y=new THREE.Vector3(0,1,0);
function holo(geo,color=HOLO,op=.16,label,edgeOp=.85){
  const g=new THREE.Group();
  const mm=new THREE.MeshBasicMaterial({color,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
  const lm=new THREE.LineBasicMaterial({color,transparent:true,opacity:edgeOp,blending:THREE.AdditiveBlending,depthWrite:false});
  const m=new THREE.Mesh(geo,mm), e=new THREE.LineSegments(new THREE.EdgesGeometry(geo,24),lm);
  g.add(m,e); g.userData.mats=[mm,lm]; if(label){g.userData.label=label;m.userData.label=label}
  return g;
}
function tint(g,c){g.userData.mats.forEach(m=>m.color.set(c))}
function fade(g,o){g.userData.mats[0].opacity=o*.2;g.userData.mats[1].opacity=o}

};

function buildEngine(cyls,o={}){
  const r=o.r||.3,L=o.L||.9,bore=o.bore||.21,h=o.h||.26;
  const grp=new THREE.Group(),crank=new THREE.Group();grp.add(crank);
  const xs=cyls.map(c=>c.x),x0=Math.min(...xs)-.22,x1=Math.max(...xs)+.22;
  const shaft=holo(new THREE.CylinderGeometry(.06,.06,x1-x0+.35,12),AMBER,.3,"Kurbelwelle");
  shaft.rotation.z=Math.PI/2;shaft.position.x=(x0+x1)/2;crank.add(shaft);
  const sMax=L+r,top=sMax+h-.04;
  const parts=cyls.map(c=>{
    const d=new THREE.Vector3(0,c.dir[0],c.dir[1]).normalize(),q=new THREE.Quaternion().setFromUnitVectors(Y,d),ph=c.ph*Math.PI/180;
    const web=holo(new THREE.BoxGeometry(.05,r+.14,.15),AMBER,.22,"Kurbelwelle");
    web.rotation.x=ph;web.position.set(c.x,r/2*Math.cos(ph),r/2*Math.sin(ph));crank.add(web);
    const pin=holo(new THREE.CylinderGeometry(.05,.05,.12,10),AMBER,.3,"Kurbelwelle");
    pin.rotation.z=Math.PI/2;pin.position.set(c.x,r*Math.cos(ph),r*Math.sin(ph));crank.add(pin);
    const lo=L-r-.05,len=top+.02-lo;
    const sleeve=holo(new THREE.CylinderGeometry(bore+.03,bore+.03,len,22,1,true),HOLO,.05,"Zylinder",.35);
    sleeve.quaternion.copy(q);sleeve.position.copy(d.clone().multiplyScalar(lo+len/2)).add(new THREE.Vector3(c.x,0,0));grp.add(sleeve);
    const piston=holo(new THREE.CylinderGeometry(bore,bore,h,22),HOLO,.28,"Kolben");piston.quaternion.copy(q);grp.add(piston);
    const rod=holo(new THREE.BoxGeometry(.07,1,.045),0xb9f3ff,.25,"Pleuelstange");grp.add(rod);
    return {c,d,ph,piston,rod,s:0};
  });
  const pinW=new THREE.Vector3(),pp=new THREE.Vector3();
  function update(th){
    crank.rotation.x=th;
    for(const p of parts){
      const a=th+p.ph;pinW.set(p.c.x,r*Math.cos(a),r*Math.sin(a));
      const cd=pinW.y*p.d.y+pinW.z*p.d.z,s=cd+Math.sqrt(L*L-r*r+cd*cd);p.s=s;
      pp.set(p.c.x,0,0).addScaledVector(p.d,s);
      p.piston.position.copy(pp).addScaledVector(p.d,h/2-.04);
      const dir=pp.clone().sub(pinW),l=dir.length();dir.normalize();
      p.rod.quaternion.setFromUnitVectors(Y,dir);p.rod.position.copy(pinW).addScaledVector(dir,l/2);p.rod.scale.y=l;
    }
  }
  update(0);
  return {grp,update,parts,top,L,r,h,bore};
}

let ACTIVE=null; // {stage,key,el}
function mountScene(el,scene,opts){
  killScene();
  const hud=document.createElement("div");hud.className="hud";hud.innerHTML='<div><div class="h1"></div><div class="h2"></div></div>';
  const pk=document.createElement("button");pk.className="pick hide";pk.type="button";pk.addEventListener("click",()=>{if(pk.dataset.term)openTerm(pk.dataset.term)});
  const hint=document.createElement("div");hint.className="hint";hint.textContent="Ziehen zum Drehen · Teil antippen";
  const ctrl=document.createElement("div");ctrl.className="ctrl";ctrl.innerHTML='<button data-c="slow" aria-pressed="false" title="Zeitlupe">½</button><button data-c="play" aria-pressed="false" title="Pause">❚❚</button>';
  el.append(hud,pk,hint,ctrl);
  let paused=false,slow=false,pt=0;
  const h1=hud.querySelector(".h1"),h2=hud.querySelector(".h2");let lastH="";
  const api={speed:()=>paused?0:slow?.35:1,hud:(a,b)=>{const s=a+"|"+b;if(s!==lastH){lastH=s;h1.textContent=a;h2.textContent=b}}};
  ctrl.addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;if(b.dataset.c==="slow"){slow=!slow;b.setAttribute("aria-pressed",slow)}else{paused=!paused;b.setAttribute("aria-pressed",paused);b.textContent=paused?"▶":"❚❚"}});
  api.btns=(defs)=>{const box=document.createElement("div");box.className="sbtns";hint.hidden=true;
    const bs=defs.map(d=>{const b=document.createElement("button");b.type="button";b.textContent=d.label;if(d.big)b.className="big";if(d.title)b.title=d.title;b.setAttribute("aria-pressed","false");
      if(d.hold){const on=e=>{e.preventDefault();b.setAttribute("aria-pressed","true");d.hold(true)},off=()=>{if(b.getAttribute("aria-pressed")==="true"){b.setAttribute("aria-pressed","false");d.hold(false)}};
        b.addEventListener("pointerdown",on);b.addEventListener("pointerup",off);b.addEventListener("pointerleave",off);b.addEventListener("pointercancel",off);b.addEventListener("contextmenu",e=>e.preventDefault())}
      else b.addEventListener("click",()=>d.click());box.append(b);return b});
    el.append(box);return bs};
  let stage;
  try{stage=makeStage(el)}catch(err){el.insertAdjacentHTML("beforeend",'<div class="hud"><div class="h2">3D ist auf diesem Gerät gerade nicht verfügbar.</div></div>');return}
  const cfg=SCENES[scene](stage,api,opts||{})||{};
  if(cfg.dist){stage.st.dist=cfg.dist}if(cfg.rotY!=null)stage.st.rotY=cfg.rotY;if(cfg.rotX!=null)stage.st.rotX=cfg.rotX;
  stage.st.onPick=l=>{const k=findTerm(l);pk.dataset.term=k||"";pk.textContent=l+(k?"  ⓘ":"");pk.classList.remove("hide");hint.hidden=true;clearTimeout(pt);pt=setTimeout(()=>pk.classList.add("hide"),k?4500:2200)};
  ACTIVE={stage,key:scene+JSON.stringify(opts||{}),el};
}
function killScene(){if(ACTIVE){ACTIVE.stage&&ACTIVE.stage.dispose();ACTIVE.el.querySelectorAll(".hud,.pick,.hint,.ctrl,.sbtns").forEach(n=>n.remove());ACTIVE=null}}

const LETTER="A-Za-zÄÖÜäöüß";
const GRE=new RegExp(`(?<![${LETTER}])(?:${GL.map(g=>"("+g[1]+")").join("|")})(?![${LETTER}])`,"g");
const GBY=Object.fromEntries(GL.map(g=>[g[0],g]));
const GSKIP="h1,h2,h3,button,a,.chip,.label,.opt,.hud,.seg,dt,summary,.gpop h3";
function gloss(root,skipKey){
  if(!root)return;const seen=new Set(skipKey?[skipKey]:[]);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&n.parentElement.closest(GSKIP)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  for(const n of nodes){const t=n.nodeValue;GRE.lastIndex=0;let m,last=0,frag=null;
    while((m=GRE.exec(t))){const gi=m.findIndex((x,i)=>i>0&&x!==undefined);const key=GL[gi-1][0];if(seen.has(key))continue;seen.add(key);
      frag=frag||document.createDocumentFragment();frag.append(t.slice(last,m.index));
      const b=document.createElement("button");b.className="term";b.dataset.term=key;b.textContent=m[0];frag.append(b);last=m.index+m[0].length}
    if(frag){frag.append(t.slice(last));n.replaceWith(frag)}}
}
function findTerm(text){GRE.lastIndex=0;const m=GRE.exec(text);if(!m)return null;const gi=m.findIndex((x,i)=>i>0&&x!==undefined);return GL[gi-1][0]}
let IN_LESSON=false;
function openTerm(key){
  const g=GBY[key];if(!g)return;document.querySelector(".gback")?.remove();
  let link="";
  if(g[4]&&!IN_LESSON){if(g[4].startsWith("m:")){const m=MOTORS[g[4].slice(2)];link=`<button class="btn ghost" data-go="${g[4]}">Mehr: ${m.name}</button>`}
    else if(LESSONS[g[4]]&&lessonState(g[4])!=="locked")link=`<button class="btn ghost" data-go="${g[4]}">Lektion: ${LESSONS[g[4]].title}</button>`}
  const bk=document.createElement("div");bk.className="gback";
  bk.innerHTML=`<div class="gpop" role="dialog" aria-label="${esc(g[2])}"><div class="label">Lexikon</div><h3>${esc(g[2])}</h3><p>${esc(g[3])}</p><div class="row">${link}<button class="btn" data-close>Verstanden</button></div></div>`;
  document.body.append(bk);gloss(bk.querySelector("p"),key);
  bk.addEventListener("click",e=>{
    const t=e.target.closest(".term");if(t){e.stopPropagation();openTerm(t.dataset.term);return}
    const go=e.target.closest("[data-go]");if(go){bk.remove();const v=go.dataset.go;v.startsWith("m:")?openMotor(v.slice(2)):openLesson(v);return}
    if(e.target===bk||e.target.closest("[data-close]"))bk.remove()});
  bk.querySelector("[data-close]").focus();
}
document.addEventListener("click",e=>{const t=e.target.closest(".term");if(t&&!t.closest(".gback")){e.preventDefault();openTerm(t.dataset.term)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelector(".gback")?.remove()});

function lessonState(id){if(S.done.includes(id))return"done";const i=ORDER.indexOf(id);if(i<0)return"soon";if(i===0||S.done.includes(ORDER[i-1]))return"current";return"locked"}
function renderLearn(){
  const next=ORDER.find(id=>!S.done.includes(id));
  const doneN=S.done.filter(id=>LESSONS[id]).length;
  let h=`<section class="hero"><div class="stage" id="hero-stage"></div><div class="hero-txt"><div><div class="label">Dein Lernpfad</div><h1>Wie ein Auto funktioniert</h1></div><span class="chip holo">${doneN}/${ORDER.length} Lektionen</span></div></section>`;

    h+=`<section class="unit"><div class="unit-head"><div><div class="label">${u.sub}</div><h2>${u.name}</h2></div>${avail?"":'<span class="chip">bald</span>'}</div><div class="path">`;
    u.lessons.forEach((id,i)=>{
      const st=lessonState(id),off=[0,-60,40,-30,55][i%5];
      const name=LESSONS[id]?LESSONS[id].title:SOON[id];
      const icon=st==="done"?"✓":st==="locked"||st==="soon"?"🔒︎":String(ORDER.indexOf(id)+1);

    });
    h+=`</div></section>`;
  });
  const pool=ORDER.filter(id=>S.done.includes(id));
  h+=`<section class="sec"><div class="unit-head"><div><div class="label">Wiederholen</div><h2>Übungsrunde</h2></div><button class="chip holo" id="prac" ${pool.length?"":"disabled"} style="padding:8px 14px;font-size:12px">${pool.length?"6 Fragen starten":"nach Lektion 1"}</button></div><p style="margin:8px 2px 0;font-size:13.5px">Zufällige Fragen aus allen Lektionen, die du schon geschafft hast. Gibt zusätzliche XP.</p></section>
  <section class="sec" style="text-align:center"><button class="chip" id="reset" style="padding:8px 14px">Fortschritt zurücksetzen</button></section>`;
  view.innerHTML=h;
  $("#prac").onclick=()=>{if(!pool.length)return;const qs=pool.flatMap(id=>LESSONS[id].steps.filter(x=>x.q));for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]]}openLesson("practice",{title:"Übungsrunde",steps:qs.slice(0,6)})};
  const rb=$("#reset");rb.onclick=()=>{if(rb.dataset.armed){S=JSON.parse(JSON.stringify(defaults));save();render();toast("Fortschritt zurückgesetzt")}else{rb.dataset.armed=1;rb.textContent="Wirklich? Nochmal tippen";rb.classList.add("amber");setTimeout(()=>{if(rb.isConnected){delete rb.dataset.armed;rb.textContent="Fortschritt zurücksetzen";rb.classList.remove("amber")}},3500)}};
  mountScene($("#hero-stage"),"engine",{layout:"inline4"});if(ACTIVE){ACTIVE.stage.st.dist=5.4;ACTIVE.stage.st.lookY=-.2}
  ACTIVE&&ACTIVE.el.querySelector(".ctrl")?.remove();
  view.querySelectorAll("[data-lesson]").forEach(b=>b.addEventListener("click",()=>{const st=lessonState(b.dataset.lesson);if(st==="locked"){toast("Schließ zuerst die vorige Lektion ab");return}if(st==="soon"){toast("Kommt im nächsten Prototyp");return}openLesson(b.dataset.lesson)}));
}

const XSVG='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const BACK='<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';

function openLesson(id,custom){
  const L=custom||LESSONS[id];const steps=L.steps.map(s=>({...s}));let i=0,firstTry=0,quizN=steps.filter(s=>s.q).length;
  const d=openSheet(`<div class="sheet-top"><button class="x" id="lx" aria-label="Lektion schließen">${XSVG}</button><div class="bar"><i id="lbar" style="width:0"></i></div></div><div class="stage" id="lstage" hidden></div><div id="lbody" class="step"></div>`);
  const foot=document.createElement("div");foot.className="foot";foot.innerHTML='<div class="foot-in"><div class="fb" id="fb" hidden></div><button class="btn" id="go">Weiter</button></div>';document.body.append(foot);
  IN_LESSON=true;$("#lx").onclick=()=>closeSheet();
  const stageEl=$("#lstage"),body=$("#lbody"),go=$("#go"),fb=$("#fb");
  let curKey=null;
  function show(){
    const s=steps[i];$("#lbar").style.width=(i/steps.length*100)+"%";foot.className="foot";fb.hidden=true;d.scrollTop=0;
    if(s.scene){const key=s.scene+JSON.stringify(s.opts||{});stageEl.hidden=false;if(key!==curKey){mountScene(stageEl,s.scene,s.opts);curKey=key}}
    else if(!s.q){stageEl.hidden=true;killScene();curKey=null}
    if(s.q){
      body.innerHTML=`<div class="label" style="margin-top:14px">${s.retry?"Noch mal":"Frage"}</div><h2>${esc(s.q)}</h2><div class="opts">${s.o.map((o,k)=>`<button class="opt" data-k="${k}" aria-pressed="false">${esc(o)}</button>`).join("")}</div>`;
      let sel=-1;go.textContent="Prüfen";go.disabled=true;
      body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(go.dataset.mode==="next")return;sel=+b.dataset.k;body.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",x===b));go.disabled=false});
      go.dataset.mode="check";
      go.onclick=()=>{if(go.dataset.mode==="check"){const ok=sel===s.a;body.querySelectorAll(".opt").forEach(x=>{const k=+x.dataset.k;if(k===s.a)x.classList.add("right");else if(k===sel)x.classList.add("wrong")});
          foot.className="foot "+(ok?"good":"bad");fb.hidden=false;fb.innerHTML=`<b>${ok?["Richtig!","Genau so.","Sitzt!"][i%3]:"Nicht ganz."}</b><span>${esc(s.e)}</span>`;gloss(fb.querySelector("span"));
          if(ok&&!s.retry)firstTry++;if(!ok&&!s.retry)steps.push({...s,retry:true});
          go.dataset.mode="next";go.textContent="Weiter"}
        else next()};
    }else{
      body.innerHTML=`<h2>${esc(s.h)}</h2>${s.t}`;gloss(body);go.textContent=i===steps.length-1?"Fertig":"Weiter";go.disabled=false;go.dataset.mode="";go.onclick=next;
    }
  }
  function next(){i++;if(i>=steps.length)finish();else show()}
  function finish(){
    killScene();stageEl.hidden=true;$("#lbar").style.width="100%";
    const prac=id==="practice",first=!prac&&!S.done.includes(id);const gain=prac?5+firstTry:first?10+firstTry*2:3;
    if(first)S.done.push(id);S.xp+=gain;
    const today=dayStr(new Date()),y=new Date();y.setDate(y.getDate()-1);
    if(S.lastDay!==today){S.streak=S.lastDay===dayStr(y)?S.streak+1:1;S.lastDay=today}save();
    const nx=ORDER.find(x=>!S.done.includes(x));
    body.innerHTML=`<div class="done-wrap"><div class="label">${prac?"Übungsrunde geschafft":"Lektion geschafft"}</div><div class="big">+${gain} XP</div><p style="margin:14px auto;max-width:34ch">${esc(L.title)}: ${firstTry} von ${quizN} Fragen auf Anhieb richtig.</p><span class="chip amber">▲ ${S.streak} ${S.streak===1?"Tag":"Tage"} in Folge</span></div>`;
    go.textContent="Zum Lernpfad";if(!nx&&!prac)body.querySelector(".done-wrap").insertAdjacentHTML("beforeend","<p style='margin-top:18px'>Das war die letzte Lektion. Du hast den ganzen Lernpfad geschafft.</p>");go.onclick=()=>closeSheet();foot.className="foot good";fb.hidden=true;
  }
  show();
}

function openMotor(id){
  const m=MOTORS[id];
  const cars=m.cars.filter(c=>CARS[c]).map(c=>`<button class="chip holo" data-car="${c}">${CARS[c].name}</button>`).join("");
  const d=openSheet(`<div class="sheet-top"><button class="x" id="mx" aria-label="Zurück">${BACK}</button><span class="label">Motorenwelt</span></div>
   <div class="detail"><h1>${m.name}</h1><p class="lede">${m.lede}</p><div class="stage" id="mstage"></div>
   <div class="sec"><h2>So funktioniert er</h2><p style="color:var(--fg)">${m.how}</p><dl class="spec">${m.spec.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl></div>
   <div class="sec"><div class="pros"><div><b style="color:var(--ok)">Stärken</b><ul>${m.pro.map(x=>`<li>${x}</li>`).join("")}</ul></div><div><b style="color:var(--bad)">Schwächen</b><ul>${m.con.map(x=>`<li>${x}</li>`).join("")}</ul></div></div></div>
   ${cars?`<div class="sec"><h2>Steckt zum Beispiel in</h2><div class="chips">${cars}</div></div>`:""}
   ${m.lesson?`<div class="sec"><button class="btn ghost" data-lesson="${m.lesson}">Passende Lektion: ${LESSONS[m.lesson].title}</button></div>`:""}</div>`);
  $("#mx").onclick=()=>closeSheet();gloss(d.querySelector(".detail"));
  mountScene($("#mstage"),m.scene,m.opts);
  d.querySelectorAll("[data-car]").forEach(b=>b.onclick=()=>openCar(b.dataset.car));
  d.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>{const st=lessonState(b.dataset.lesson);if(st==="locked"){toast("Diese Lektion ist noch gesperrt");return}openLesson(b.dataset.lesson)});
}

function openCar(id){
  const c=CARS[id];let vi=S.variant[id]!=null?S.variant[id]:0;
  const d=openSheet(`<div class="sheet-top"><button class="x" id="cx" aria-label="Zurück">${BACK}</button><span class="label" style="flex:1">${c.body}</span><button class="pin" id="cpin" aria-pressed="${S.pinned.includes(id)}" aria-label="Anpinnen">${PIN}</button></div><div class="detail" id="cbody"></div>`);
  $("#cx").onclick=()=>closeSheet();
  $("#cpin").onclick=e=>{togglePin(id);e.currentTarget.setAttribute("aria-pressed",S.pinned.includes(id))};
  function draw(){
    const v=c.variants[vi],m=MOTORS[v.motor];
    const fuelCard=/Diesel/.test(v.fuel)&&!/Benzin/.test(v.fuel)?"diesel":/Benzin/.test(v.fuel)&&!/Diesel/.test(v.fuel)?"benziner":null;
    $("#cbody").innerHTML=`<h1>${c.name}${c.nick?` <span class="muted" style="font-size:22px">„${c.nick}“</span>`:""}</h1><p class="lede">${c.years} · ${c.intro}</p>
    ${c.variants.length>1?`<div class="label">Welche Version hast du?</div><div class="seg">${c.variants.map((x,k)=>`<button data-v="${k}" aria-pressed="${k===vi}">${x.n} <span class="muted" style="font-size:11px">${x.y}</span></button>`).join("")}</div>`:""}
    <div class="stage" id="cstage"></div>
    <div class="sec"><h2>Was du vor dir hast</h2><dl class="spec">
      <dt>Motor</dt><dd><a class="link" data-motor="${v.motor}">${ENGNAME[v.eng]}</a>${v.eng==="v6"?"":""}</dd>
      <dt>Kraftstoff</dt><dd>${fuelCard?`<a class="link" data-motor="${fuelCard}">${v.fuel}</a>`:v.fuel}</dd>
      <dt>Hubraum</dt><dd>${v.size}</dd><dt>Leistung</dt><dd>${v.power}</dd>
      <dt>Kühlung</dt><dd>${v.cool}</dd><dt>Getriebe</dt><dd>${c.gearbox}</dd><dt>Antrieb</dt><dd>${c.driveText}</dd></dl>
      <p class="muted" style="font-size:13px;margin-top:8px">Genau steht es in deinem Fahrzeugschein: P.1 Hubraum, P.2 Leistung in kW, P.3 Kraftstoff.</p></div>
    ${c.where?`<div class="sec"><h2>Wo sitzt was?</h2><ul class="plain">${c.where.map(([a,b])=>`<li><b>${a}</b>${b}</li>`).join("")}</ul></div>`:""}
    ${c.weak?`<div class="sec"><h2>Typische Schwachstellen</h2><ul class="plain warn">${c.weak.map(([a,b])=>`<li><b>${a}</b>${b}</li>`).join("")}</ul></div>`:""}
    ${c.guides?`<div class="sec"><h2>Wie mache ich …</h2>${c.guides.map(g=>`<details><summary>${g.t}</summary><ol>${g.steps.map(s=>`<li>${s}</li>`).join("")}</ol>${g.t==="Ölstand prüfen"&&c.where?`<div class="note">Bei deinem ${c.name}: ${c.where.find(w=>w[0]==="Ölmessstab")[1]}</div>`:""}</details>`).join("")}</div>`:""}
    ${c.compare?`<div class="sec"><div class="unit-head"><div><div class="label">Motor gesucht?</div><h2>Welcher Motor passt in deinen ${c.name}?</h2></div></div><button class="btn ghost" id="cmp" style="margin-top:10px">Motoren vergleichen</button></div>`:""}
    <div class="sec"><h2>Passende Lektionen</h2><div class="chips">${c.lessons.map(l=>`<button class="chip holo" data-lesson="${l}">${LESSONS[l].title}</button>`).join("")}</div></div>`;
    gloss($("#cbody"));mountScene($("#cstage"),"car",{car:id,v:vi});
    d.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{vi=+b.dataset.v;S.variant[id]=vi;save();draw()});
    const cb=d.querySelector("#cmp");if(cb)cb.onclick=()=>openCompare(id);
    d.querySelectorAll("[data-motor]").forEach(b=>b.onclick=()=>openMotor(b.dataset.motor));
    d.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>{const st=lessonState(b.dataset.lesson);if(st==="locked"){toast("Diese Lektion ist noch gesperrt");return}openLesson(b.dataset.lesson)});
  }
  draw();
}


const T3CMP=[
 {n:"Luftgekühlter Boxer",y:"1979–1983",eng:"boxer4",kw:"1,6 l / 2,0 l · 50 bis 70 PS",cool:"Luft, Gebläse am Motor",
  pro:["Einfach aufgebaut, keine Wasserleitungen","Kein Kühlmittel, keine Wasserpumpe","Typischer Klang, gute Teileversorgung über die Käfer- und Bus-Szene"],
  con:["Wenig Kraft für den schweren Bus","Kann bei Last, Bergen und Hitze warm werden","Ventilspiel muss regelmäßig eingestellt werden"],
  fit:"Einfachster Weg, wenn dein T3 ab Werk luftgekühlt war. Bei einem Bus, der ab Werk einen Wasserboxer hatte, passen Anbauteile, Heizung und Kühlluftführung nicht ohne Umbau."},
 {n:"Wasserboxer",y:"1983–1992",eng:"boxer4",kw:"1,9 l / 2,1 l · 60 bis 112 PS",cool:"Wasser, Kühler vorne",
  pro:["Mehr Leistung, besonders der 2,1 l","Leiser, gleichmäßige Temperatur","Bessere Heizung im Innenraum"],
  con:["Zylinderkopfdichtungen sind eine bekannte Schwachstelle","Lange Kühlmittelleitungen, Entlüften braucht Geduld","Korrosion im Kühlsystem bei altem Kühlmittel"],
  fit:"Einfachster Weg, wenn dein T3 ab Werk einen Wasserboxer hatte. Kühler, Leitungen und Ausgleichsbehälter sind dann schon da."},
 {n:"Diesel / Turbodiesel",y:"1981–1992",eng:"inline4",kw:"1,6 l / 1,7 l · 50 bis 70 PS",cool:"Wasser, Kühler vorne",
  pro:["Sparsam","Robust und langlebig","Der Turbodiesel hat spürbar mehr Durchzug als der Saugdiesel"],
  con:["Sehr wenig Leistung für das Gewicht","Laut, langsam auf der Autobahn","Zahnriemen und Einspritzpumpe brauchen Pflege"],
  fit:"Ein Reihenmotor statt Boxer, mit eigener Motoraufhängung und Anbauteilen. Passt am einfachsten, wenn der Bus ab Werk Diesel war."}
];
function openCompare(id){
  const c=CARS[id];let sel=0;
  const d=openSheet(`<div class="sheet-top"><button class="x" id="kx" aria-label="Zurück">${BACK}</button><span class="label">${c.name} · Motorvergleich</span></div>
   <div class="detail"><h1>Welcher Motor für deinen ${c.name}?</h1><p class="lede">Drei Motorfamilien gab es ab Werk. Hier siehst du sie nebeneinander.</p>
   <div class="seg" id="ksel">${T3CMP.map((m,k)=>`<button data-k="${k}" aria-pressed="${k===0}">${m.n}</button>`).join("")}</div>
   <div class="stage small" id="kstage"></div><div id="kbody"></div>
   <div class="sec"><h2>Bevor du einen Motor kaufst</h2><ul class="plain">
    <li><b>Was war ab Werk drin?</b>Im Fahrzeugschein stehen Hubraum (P.1), Leistung (P.2) und Kraftstoff (P.3). Am Block selbst sind die Motorkennbuchstaben eingeschlagen.</li>
    <li><b>Gleicher Typ ist am einfachsten</b>Ein Motor der gleichen Familie wie ab Werk passt meist ohne große Umbauten und ohne neue Eintragung.</li>
    <li><b>Anderer Typ heißt Eintragung</b>In Deutschland muss ein anderer Motor als ab Werk in der Regel vom TÜV oder einer anderen Prüfstelle abgenommen und eingetragen werden. Frag am besten vorher dort nach, was sie brauchen.</li>
   </ul>
   <details><summary>Checkliste beim Motorkauf</summary><ol>
    <li>Kompression messen lassen. Alle Zylinder sollten ähnliche Werte haben.</li>
    <li>Wenn möglich laufen hören: kein Klopfen, kein blauer Rauch, kein weißer Dauerqualm beim Benziner.</li>
    <li>Auf Ölverlust und beim Wasserboxer auf Spuren von Kühlmittel am Zylinderkopf achten.</li>
    <li>Klären, welche Anbauteile dabei sind: Vergaser oder Einspritzung, Lichtmaschine, Anlasser, Kabelbaum.</li>
    <li>Herkunft und Laufleistung schriftlich geben lassen.</li>
    <li>Kupplung gleich mit erneuern. Besser geht man nie wieder dran.</li>
   </ol></details></div></div>`);
  $("#kx").onclick=()=>openCar(id);
  function draw(){const m=T3CMP[sel];
    d.querySelectorAll("#ksel button").forEach((b,k)=>b.setAttribute("aria-pressed",k===sel));
    $("#kbody").innerHTML=`<dl class="spec" style="margin-top:12px"><dt>Bauzeit</dt><dd>${m.y}</dd><dt>Motor</dt><dd><a class="link" data-motor="${m.eng==="inline4"?"reihe":"boxer"}">${ENGNAME[m.eng]}</a>${m.eng==="inline4"?", Diesel":", Benzin"}</dd><dt>Hubraum</dt><dd>${m.kw}</dd><dt>Kühlung</dt><dd>${m.cool}</dd></dl>
     <div class="pros" style="margin-top:12px"><div><b style="color:var(--ok)">Dafür</b><ul>${m.pro.map(x=>`<li>${x}</li>`).join("")}</ul></div><div><b style="color:var(--bad)">Dagegen</b><ul>${m.con.map(x=>`<li>${x}</li>`).join("")}</ul></div></div>
     <ul class="plain warn" style="margin-top:12px"><li><b>Passt das bei mir?</b>${m.fit}</li></ul>`;
    gloss($("#kbody"));d.querySelectorAll("#kbody [data-motor]").forEach(b=>b.onclick=()=>openMotor(b.dataset.motor));
    mountScene($("#kstage"),"engine",{layout:m.eng});ACTIVE&&ACTIVE.el.querySelector(".ctrl")?.remove()}
  d.querySelectorAll("#ksel button").forEach(b=>b.onclick=()=>{sel=+b.dataset.k;draw()});
  gloss(d.querySelector(".detail > .sec"));draw();
}
updateStats();render();
